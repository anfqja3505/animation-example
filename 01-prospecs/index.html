<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로스펙스</title>
    <link rel="shortcut icon" href="./images/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="reset.css">
    <style>
        body, html {
            background-color:#111;
            scroll-behavior: smooth;
        }
        /* Firefox */
        html {scrollbar-width: 10px;;scrollbar-color: #222 #ff0;}
        /* Opera */
        html::-o-scrollbar {width: 10px;}
        html::-o-scrollbar-thumb {background-color: #222;border-radius: 5px;}
        /* Chrome, Safari, Edge 등 웹킷 기반 브라우저 */
        ::-webkit-scrollbar {width: 10px;}
        ::-webkit-scrollbar-track {box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.3);}
        ::-webkit-scrollbar-thumb {background-color: #222;border-radius: 5px;}
        #top_btn {
            width:50px; line-height:50px; display:block; font-size:0.75rem;
            border-radius:50%; text-align:center;
            position:fixed; right:50px; bottom:50px; z-index:999;
            background:#000; color:#fff;
            box-shadow:0 0 10px rgba(255,255,255,0.25);
        }
        /* header, main, footer, nav를 그룹으로 묶어서 모두 선택해, 최소 너비 제한을 1000px로 설정해서 1000px 이하로 작아지지 않게함 */
        header,main,footer,nav {min-width:1000px;}
        header {text-align:center; padding:15px 0;}
        header img {width:80px;}
        nav {
            width:100%; margin:0 auto; background:#222;
            display:flex; justify-content:space-around;
            /* ====================================스크롤 내릴 시 내비고정 CSS */
            position: sticky; top:0; z-index: 900;
        }
        nav a {position:relative; display:inline-block; line-height:60px; padding:0 20px; color:#fff; font-size:0.875rem;}
        /* (아래) a의 가상자식 after를 생성(필수 속성 및 안보이게 설정) */
        nav a::after {display:block; position:absolute; content:''; background:#e73b3b; width:100%; height:1px; bottom:1px; left:0; display:none;}
        /* (아래) a에 마우스를 올렸을때 css 속성 변경  */
        nav a:hover {color:#e73b3b;}
        /* (아래) a에 마우스를 올렸을때 가상자식 css 속성 변경 none -> block (안보이게 -> 보이게) */
        nav a:hover::after {display:block;}
        main {}
        /* (아래) section의 공통값 적용 */
        main section {
            height:100vh; /* vh 뷰포트 높이(뷰포트 = 사용자가 보는 화면 높이) */
            background-size:cover;
            background-position:center;
            position:relative;
        }
        /* (아래) section의 class, id명이 없어 정확한 선택 후 배경이미지를 적용 하기 위해 수열 선택자 사용 */
        main section:nth-child(1) {background-image:url(images/optimize1.png);}
        main section:nth-child(2) {
            background-image:url(https://images.unsplash.com/photo-1566932769119-7a1fb6d7ce23?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
            /* (아래) 스크롤 움직일때 배경이미지 고정 */
            background-attachment: fixed;
        }
        main section:nth-child(3) {background-image:url(https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);}
        main section h2 {
            /* (아래) 사용자가 보는 화면높이(vh)에 맞춰 항상 위치를 고정시키기 */
            position:absolute; left:50px; bottom:50px;
            font-size:3rem; font-weight:700; line-height:1.3; color:#fff;
        }
        footer {font-size:0.875rem; color:#aaa; text-align:center; padding:50상x 0;}
    </style>
</head>
<body>
    <!-- (아래) top버튼(CTA) 클릭 시 sction2번 위치로 이동하기 -->
    <a href="#line" id="top_btn">TOP</a>
    <header>
        <h1><img src="images/logo.svg" alt="프로스펙스"></h1>
    </header>
    <nav>
        <a href="#hero">SHOP</a>
        <a href="#club">EVENT</a>
        <a href="#">ARCHIVE</a>
        <a href="#">SPONSORSHIP</a>
        <a href="#">SMART FIT</a>
    </nav>
    <main>
        <section id="hero"></section>
        <section id="line"><h2>새로워진<br>퍼포먼스 라인을 만나다</h2></section>
        <section id="club"><h2>시선을 사로잡는<br>오리지널 스포츠 클럽</h2></section>
    </main>
    <footer>COPYRIGHT &copy; LS NETWORKS CO. ALL RIGHTS RESERVED
    </footer>
</body>
</html>
